  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#5A6982">구글 상위일수록 AI 답변에 인용될 확률이 높다 (개념도, Ahrefs 조사)</text>

  <!-- y grid + labels -->
  <g font-size="11" fill="#8A97A8">
