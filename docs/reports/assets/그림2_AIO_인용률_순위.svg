<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="640" height="490" fill="#FFFFFF"/>
