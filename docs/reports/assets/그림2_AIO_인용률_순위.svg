    <rect x="240" y="90" width="38" height="243.2" fill="#F0A28A"/><rect x="240" y="333.2" width="38" height="76.8" fill="#2E7BB0"/>
    <rect x="294" y="90" width="38" height="259.2" fill="#F0A28A"/><rect x="294" y="349.2" width="38" height="60.8" fill="#2E7BB0"/>
    <rect x="348" y="90" width="38" height="268.8" fill="#F0A28A"/><rect x="348" y="358.8" width="38" height="51.2" fill="#2E7BB0"/>
    <rect x="402" y="90" width="38" height="294.4" fill="#F0A28A"/><rect x="402" y="384.4" width="38" height="25.6" fill="#2E7BB0"/>
